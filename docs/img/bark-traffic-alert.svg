<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- iPhone wallpaper-ish background -->
  <rect width="400" height="200" rx="24" fill="#0a1628"/>
  <circle cx="340" cy="30" r="60" fill="#1e3a5f" opacity="0.6"/>
  <circle cx="60" cy="180" r="50" fill="#14324f" opacity="0.5"/>
  <!-- Notification card -->
  <g filter="url(#shadow)">
    <rect x="16" y="24" width="368" height="152" rx="20" fill="url(#bg)" opacity="0.96"/>
  </g>
  <rect x="16" y="24" width="368" height="152" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- App icon -->
  <rect x="32" y="40" width="36" height="36" rx="9" fill="#ff3b30"/>
  <text x="50" y="65" font-family="sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">&#128276;</text>
  <!-- Header -->
  <text x="78" y="54" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#ffffff" opacity="0.85">Bark</text>
  <text x="368" y="54" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.55" text-anchor="end">now</text>
  <!-- Title -->
  <text x="32" y="102" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#ffffff">&#128680; VPS &#27969;&#37327;&#36229;&#38480;&#35686;&#21578; (&#24050;&#38480;&#36895;)</text>
  <!-- Body -->
  <text x="32" y="126" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#ffffff" opacity="0.85">&#32593;&#21345;: eth0  &#20844;&#32593; IP: 129.150.50.139 (&#26032;&#21152;&#22369;)</text>
  <text x="32" y="148" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#ffffff" opacity="0.85">&#24403;&#21069;&#20986;&#31449;&#27969;&#37327;: 200.15 GB  &#29366;&#24577;: &#24050;&#24378;&#21046;&#38480;&#36895;&#33267; 1600kbit</text>
